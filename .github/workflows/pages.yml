name: Deploy AscendGYM to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - website-static.zip
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v6
      - name: Extract compiled website
        run: |
          mkdir -p _site
          unzip -q website-static.zip -d _site
          test -s _site/index.html
          test -s _site/AscendGYM_TechReport.pdf
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
